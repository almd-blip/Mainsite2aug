<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Wall & Room Gradients -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2228" />
      <stop offset="50%" stop-color="#1f1821" />
      <stop offset="100%" stop-color="#140f17" />
    </linearGradient>

    <!-- Blue Arch Glow -->
    <radialGradient id="blue-arch-glow" cx="80%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Spotlight on Left Artwork -->
    <radialGradient id="artwork-light" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Painting Pattern on Wall -->
    <pattern id="dot-artwork-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#a14227" />
      <circle cx="5" cy="5" r="2" fill="#fef08a" />
      <circle cx="15" cy="5" r="1.5" fill="#f43f5e" />
      <circle cx="10" cy="10" r="2.5" fill="#fdba74" />
      <circle cx="5" cy="15" r="1.8" fill="#ffffff" />
      <circle cx="15" cy="15" r="2" fill="#fef08a" />
    </pattern>

    <!-- Body Dot Pattern -->
    <pattern id="body-dot-pattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#6c3f31" />
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" />
      <circle cx="9" cy="3" r="1" fill="#fef08a" />
      <circle cx="6" cy="6" r="1.5" fill="#f472b6" />
      <circle cx="3" cy="9" r="1" fill="#fb923c" />
      <circle cx="9" cy="9" r="1.3" fill="#ffffff" />
    </pattern>
  </defs>

  <!-- Background Gallery Room -->
  <rect width="1000" height="600" fill="url(#wall-grad)" />

  <!-- Blue Glow Arch Effect -->
  <rect width="1000" height="600" fill="url(#blue-arch-glow)" />
  <rect width="1000" height="600" fill="url(#artwork-light)" />

  <!-- Left Wall Large Dot Painting -->
  <g transform="translate(30, 180) rotate(-2)">
    <rect width="380" height="260" rx="4" fill="url(#dot-artwork-pattern)" stroke="#451a03" stroke-width="4" />
    <!-- Fine frame shadow -->
    <rect x="-2" y="-2" width="384" height="264" fill="none" stroke="#2a1202" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Right Background Archway to Gallery Room -->
  <g transform="translate(620, 90)">
    <!-- Arch opening -->
    <path d="M 0,400 L 0,160 A 110,110 0 0,1 220,160 L 220,400 Z" fill="#0f0c12" />
    <!-- Bright Blue Arch Trim Glow -->
    <path d="M -8,400 L -8,160 A 118,118 0 0,1 228,160 L 228,400" fill="none" stroke="#3b82f6" stroke-width="12" opacity="0.85" filter="drop-shadow(0 0 10px #2563eb)" />
    <!-- Far gallery room paintings -->
    <g transform="translate(40, 180)" opacity="0.7">
      <rect x="10" y="20" width="45" height="35" fill="#451a03" stroke="#eab308" stroke-width="2" />
      <rect x="65" y="10" width="55" height="40" fill="#27272a" stroke="#eab308" stroke-width="2" />
      <rect x="130" y="25" width="40" height="30" fill="#3f6212" stroke="#eab308" stroke-width="2" />
    </g>
  </g>

  <!-- Raised White Platform Stage -->
  <polygon points="50,490 950,490 910,580 90,580" fill="#e2e8f0" />
  <polygon points="50,490 90,580 90,600 50,490" fill="#cbd5e1" />
  <polygon points="90,580 910,580 910,600 90,600" fill="#94a3b8" />

  <!-- Left Kneeling Figure (Male pose facing right) -->
  <g transform="translate(320, 260)">
    <!-- Body silhouette textured with body dots -->
    <!-- Head -->
    <circle cx="60" cy="40" r="22" fill="url(#body-dot-pattern)" />
    <!-- Torso -->
    <path d="M 42,60 Q 60,60 78,65 L 88,140 Q 60,150 35,140 Z" fill="url(#body-dot-pattern)" />
    <!-- Arms resting on thighs -->
    <path d="M 45,68 L 95,120 Q 105,135 85,145 L 70,140" fill="url(#body-dot-pattern)" />
    <!-- Kneeling Legs -->
    <path d="M 35,135 Q 20,165 10,210 Q 55,225 100,210 Q 75,180 85,145 Z" fill="url(#body-dot-pattern)" />
    <!-- Shorts/Garment -->
    <path d="M 35,135 L 88,140 L 92,165 L 30,162 Z" fill="#a855f7" opacity="0.4" />
  </g>

  <!-- Right Kneeling Figure (Female pose with hair, facing left) -->
  <g transform="translate(510, 250)">
    <!-- Hair bun -->
    <circle cx="110" cy="40" r="18" fill="#2d1a15" />
    <circle cx="100" cy="48" r="14" fill="url(#body-dot-pattern)" />
    <!-- Head facing left -->
    <circle cx="60" cy="50" r="20" fill="url(#body-dot-pattern)" />
    <!-- Torso -->
    <path d="M 42,70 Q 60,70 75,72 L 82,150 Q 60,160 38,150 Z" fill="url(#body-dot-pattern)" />
    <!-- Arms resting on thighs -->
    <path d="M 48,78 L 20,130 Q 15,145 35,155 L 50,150" fill="url(#body-dot-pattern)" />
    <!-- Kneeling Legs -->
    <path d="M 38,145 Q 20,180 15,220 Q 60,230 105,220 Q 85,185 82,150 Z" fill="url(#body-dot-pattern)" />
    <!-- Top/Garment -->
    <path d="M 42,80 L 75,82 L 78,110 L 40,108 Z" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Ambient Stage Lighting Reflection -->
  <ellipse cx="500" cy="510" rx="350" ry="15" fill="#ffffff" opacity="0.2" />

  <!-- Overlay Title Banner -->
  <text x="500" y="550" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="3">
    SHARED PRESENCE &amp; DIALOGUE · ART GALLERY PERFORMANCE
  </text>
</svg>
